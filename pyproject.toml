[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hass-xiaomi-m365"
dynamic = ["version"]
requires-python = ">=3.14.2"

[project.optional-dependencies]
lint = [
    "ruff==0.17.1",
]
test = [
    "pytest-homeassistant-custom-component==0.13.373",
    # Home Assistant's bluetooth integration, which this one depends on, keeps
    # its requirements in its manifest rather than in the package metadata.
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.2.0",
    "habluetooth==7.1.2",
    "serialx==1.15.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/xiaomi_m365"]

[tool.hatch.envs.default]
# Through an extra rather than env dependencies, so Dependabot can see the pin.
features = ["lint"]

[tool.hatch.envs.default.scripts]
lint = [
    "ruff format --check --diff .",
    "ruff check .",
]
fix = [
    "ruff format .",
    "ruff check --fix .",
]

[tool.hatch.envs.test]
python = "3.14"
features = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FURB", "G", "I", "LOG", "PERF",
    "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "SLF", "T20", "TRY", "UP", "W",
]
ignore = [
    "ASYNC109", # per-step protocol waits, not a caller's deadline
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length is the formatter's job
    "PLR2004", # protocol offsets and lengths are magic by nature
    "S101",    # asserts narrow types in flow steps
    "TRY003",  # long messages carry the scooter's address
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false
