[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hass-xiaomi-m365"
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/xiaomi_m365"]

[tool.hatch.envs.default]
dependencies = [
    "black",
]

[tool.hatch.envs.default.scripts]
test = [
    "black --check --diff .",
]
lint = [
    "black ."
]

[tool.black]
target-version = ["py313"]
